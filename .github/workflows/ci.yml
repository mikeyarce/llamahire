name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coding-standards:
    name: WordPress VIP PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install PHP quality tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run extension contract unit tests
        run: composer test:unit
      - name: Run WordPress VIP coding standards
        run: composer phpcs
      - name: Check PHP 7.4+ compatibility
        run: composer phpcompatibility

  package:
    name: Installable Free package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate visual design contract
        run: npm run design:lint
      - name: Build production JavaScript
        run: npm run build
      - name: Build installable ZIP and checksum
        run: bash scripts/build-release.sh
      - name: Verify installable ZIP
        run: unzip -t dist/llamahire-*.zip
      - name: Verify development files are excluded
        run: |
          if unzip -Z1 dist/llamahire-*.zip | grep -Eq '(^|/)(tools|tests|scripts|docs|node_modules|package(-lock)?\.json|\.[^/]+)(/|$)'; then
            echo 'Development-only files were found in the release ZIP.'
            exit 1
          fi
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/llamahire
          exclude-checks: plugin_review_phpcs

  translations:
    name: Translation template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli:2.12.0
      - run: npm ci
      - name: Generate translation template
        run: npm run i18n:make-pot
      - name: Verify translation template is current
        run: git diff --exit-code -- languages/llamahire.pot

  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1', '8.3', '8.5' ]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
      - name: Check editor JavaScript syntax
        run: |
          node --check assets/js/admin-settings.js
          node --check assets/js/application-form.js
          node --check assets/js/blocks.js
          node --check assets/js/job-editor.js

  smoke:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: minimum-6.5
            core: WordPress/WordPress#6.5
            php: '7.4'
            experimental: false
          - wordpress: latest
            core: ''
            php: '7.4'
            experimental: false
          - wordpress: latest
            core: ''
            php: '8.5'
            experimental: false
          - wordpress: development
            core: WordPress/WordPress#master
            php: '8.5'
            experimental: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare archived Debian dependencies for PHP 7.4
        if: matrix.php == '7.4'
        run: docker build -f .github/php74.Dockerfile -t wordpress:php7.4 .github
      - name: Start latest WordPress
        if: matrix.core == ''
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npm run env:start
      - name: Start selected WordPress version
        if: matrix.core != ''
        env:
          WP_ENV_CORE: ${{ matrix.core }}
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npm run env:start
      - name: Run contract smoke suite
        run: npm run test:smoke
      - name: Required extension persistence and rollback
        run: |
          npm run wp-env -- run cli wp eval-file wp-content/plugins/llamahire/tests/atomic-submissions.php
          npm run wp-env -- run cli wp eval-file wp-content/plugins/llamahire/tests/application-extension-boundaries.php
      - name: Stop WordPress
        if: always()
        continue-on-error: true
        run: npm run env:stop

  browser:
    name: Browser hiring workflow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start disposable WordPress site
        env:
          WP_ENV_PHP_VERSION: '8.3'
        run: npm run env:start
      - name: Create browser fixtures
        run: npm run test:e2e:setup
      - name: Run browser workflow
        run: npm run test:e2e
      - name: Run launch theme compatibility matrix
        run: npm run test:e2e:themes
      - name: Remove browser fixtures
        if: always()
        continue-on-error: true
        run: npm run test:e2e:cleanup
      - name: Capture WordPress logs
        if: failure()
        continue-on-error: true
        run: npm run wp-env -- logs --watch=false
      - name: Stop WordPress
        if: always()
        continue-on-error: true
        run: npm run env:stop
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-theme-report/
          retention-days: 14

  multisite-uninstall:
    name: Multisite full uninstall
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start disposable multisite network
        env:
          WP_ENV_PHP_VERSION: '8.3'
        run: npm run env:multisite:start
      - name: Verify network-wide full uninstall
        run: npm run test:uninstall:multisite
      - name: Stop WordPress
        if: always()
        continue-on-error: true
        run: npm run env:multisite:stop

  fixtures:
    name: WP-CLI fixture lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start disposable WordPress site
        env:
          WP_ENV_PHP_VERSION: '8.3'
        run: npm run env:start
      - name: Test deterministic fixture generation and ownership-safe cleanup
        run: npm run test:fixtures
      - name: Stop WordPress
        if: always()
        continue-on-error: true
        run: npm run env:stop

  atomic-sqlite:
    name: SQLite atomic submission contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify rollback, retries and duplicates with SQLite
        run: bash scripts/test-atomic-sqlite.sh

  extensions-minimum:
    name: Application extension browser / WordPress 6.5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare archived Debian dependencies for PHP 7.4
        run: docker build -f .github/php74.Dockerfile -t wordpress:php7.4 .github
      - name: Start minimum supported WordPress
        env:
          WP_ENV_CORE: WordPress/WordPress#6.5
          WP_ENV_PHP_VERSION: '7.4'
        run: npm run env:start
      - name: Verify submissions and admin quick view
        run: npx playwright test tests/e2e/application-extensions.spec.js
      - name: Clean disposable fixtures
        if: always()
        continue-on-error: true
        run: npm run wp-env -- run cli wp eval-file wp-content/plugins/llamahire/tests/e2e/application-extension-fixtures.php cleanup
      - name: Stop WordPress
        if: always()
        continue-on-error: true
        run: npm run env:stop
