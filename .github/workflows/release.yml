name: Release free plugin

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and deploy ${{ github.event.release.tag_name }}
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: wordpress.org
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2, wp-cli

      - name: Resolve and verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PLUGIN_VERSION="$(sed -n 's/^[[:space:]]*\* Version:[[:space:]]*//p' llamahire.php | head -n 1)"
          CONSTANT_VERSION="$(sed -n "s/^define( 'LLAMAHIRE_VERSION', '\\([^']*\\)' );/\\1/p" llamahire.php)"
          STABLE_TAG="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n 1)"

          if [[ ! "${VERSION}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Release tag must be a version such as 1.2.3 or v1.2.3."
            exit 1
          fi

          if [[ "${PLUGIN_VERSION}" != "${VERSION}" || "${CONSTANT_VERSION}" != "${VERSION}" || "${STABLE_TAG}" != "${VERSION}" ]]; then
            echo "Release ${VERSION} does not match all plugin version fields."
            echo "Plugin header: ${PLUGIN_VERSION}"
            echo "LLAMAHIRE_VERSION: ${CONSTANT_VERSION}"
            echo "Stable tag: ${STABLE_TAG}"
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run WordPress VIP coding standards
        run: composer phpcs

      - name: Check PHP 7.4+ compatibility
        run: composer phpcompatibility

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -not -path './dist/*' -print0 | xargs -0 -n1 php -l

      - name: Verify translation template
        run: |
          npm run i18n:make-pot
          git diff --exit-code -- languages/llamahire.pot

      - name: Build production assets
        run: npm run build

      - name: Build installable ZIP and checksum
        run: bash scripts/build-release.sh

      - name: Verify installable ZIP
        run: unzip -t "dist/llamahire-${{ steps.version.outputs.version }}.zip"

      - name: Verify development files are excluded
        run: |
          if unzip -Z1 "dist/llamahire-${{ steps.version.outputs.version }}.zip" | grep -Eq '(^|/)(tools|tests|scripts|docs|node_modules|vendor|package(-lock)?\.json|composer\.(json|lock)|phpcs\.xml(\.dist)?|\.[^/]+)(/|$)'; then
            echo 'Development-only files were found in the release ZIP.'
            exit 1
          fi

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/llamahire
          exclude-checks: plugin_review_phpcs

      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/*.zip dist/*.sha256 --clobber

      - name: Deploy to WordPress.org
        if: vars.WPORG_DEPLOY_ENABLED == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: llamahire
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: dist/llamahire
